<dialog #dialog class="image-viewer" [attr.aria-label]="'imageViewer.title' | t" (click)="onBackdropClick($event)" (close)="onClosed()">
  <div class="viewer-panel">
    <header class="viewer-toolbar">
      <span>{{ 'imageViewer.title' | t }}</span>
      <div class="viewer-controls">
        <button type="button" (click)="changeZoom(-0.5)" [disabled]="zoom <= 1" [attr.aria-label]="'imageViewer.zoomOut' | t"><span aria-hidden="true">−</span></button>
        <output aria-live="polite">{{ zoom * 100 }} %</output>
        <button type="button" (click)="changeZoom(0.5)" [disabled]="zoom >= 3" [attr.aria-label]="'imageViewer.zoomIn' | t"><span aria-hidden="true">+</span></button>
        <button type="button" (click)="close()" autofocus>{{ 'imageViewer.close' | t }} <span aria-hidden="true">×</span></button>
      </div>
    </header>
    <div #viewport class="viewer-viewport" tabindex="0" [attr.aria-label]="'imageViewer.pan' | t">
      @if (image) {
        <img #fullImage [src]="image" [alt]="caption" [style.width.px]="fittedWidth ? fittedWidth * zoom : null" (load)="fitImage()" />
      }
    </div>
    @if (caption) {
      <p class="viewer-caption">{{ caption }}</p>
    }
  </div>
</dialog>
