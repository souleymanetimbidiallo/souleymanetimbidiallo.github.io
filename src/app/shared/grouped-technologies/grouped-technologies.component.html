<div class="technology-groups">
  @for (group of groups; track $index) {
    <section class="technology-group">
      <span class="technology-group__label">{{ group.labelKey | t }}</span>
      <ul class="technology-group__items">
        @for (technology of group.technologies; track $index) {
          <li>{{ technology.label }}</li>
        }
      </ul>
    </section>
  }
</div>
